[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cybervallum"
version = "0.1.0"
description = "Strumento personale da terminale per sistemistica, sicurezza e controllo della rete."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "psutil>=5.9",
    "typer>=0.12",
    "pytest>=8.0",
    "tomli-w>=1.0",
]

[project.scripts]
cybervallum = "cybervallum.cli:app"
vallum = "cybervallum.cli:app"

[tool.setuptools.packages.find]
include = ["cybervallum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Only rules that catch real mistakes (see docs/ai-locale.md):
# F = undefined names, duplicate definitions, unused imports; E4/E7/E9 = syntax and import errors;
# E30 = blank lines between functions (too many or too few).
select = ["F", "E4", "E7", "E9", "E30"]
preview = true
explicit-preview-rules = false
