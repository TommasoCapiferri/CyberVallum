[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cybervallum"
version = "0.1.0"
description = "Strumento personale da terminale per sistemistica, sicurezza e controllo della rete."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "psutil>=5.9",
    "typer>=0.12",
    "pytest>=8.0",
    "tomli-w>=1.0",
]

[project.scripts]
cybervallum = "cybervallum.cli:app"
vallum = "cybervallum.cli:app"

[tool.setuptools.packages.find]
include = ["cybervallum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
